name: Build WaveOrbit (Android APK & Windows EXE)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Bootstrap Flutter Android project & inject code
        run: |
          mkdir -p _backup
          cp pubspec.yaml _backup/pubspec.yaml
          cp -r lib _backup/lib
          flutter create . --project-name wave_orbit --platforms=android
          cp _backup/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r _backup/lib lib
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveOrbit-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Bootstrap Flutter Windows project & inject code
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _backup
          Copy-Item pubspec.yaml _backup/pubspec.yaml
          Copy-Item -Recurse lib _backup/lib
          flutter create . --project-name wave_orbit --platforms=windows
          Copy-Item -Force _backup/pubspec.yaml pubspec.yaml
          Remove-Item -Recurse -Force lib
          Copy-Item -Recurse _backup/lib lib

      - name: Get dependencies & Build Windows
        run: |
          flutter pub get
          flutter build windows --release

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveOrbit-Windows-EXE
          path: build/windows/x64/runner/Release/
          retention-days: 30
